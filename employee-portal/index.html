<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075985">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="بصمة ركائز">
  <title>ركائز | بصمة الموظف</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="fingerprint-icon.svg" type="image/svg+xml">
  <link rel="icon" href="fingerprint-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="fingerprint-icon-180.png" sizes="180x180">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=20260728-schedule-notifications">
  <link rel="stylesheet" href="notifications.css?v=20261005-approval-notifications">
  <link rel="stylesheet" href="login-phone.css?v=20260725-bilingual-phone-login">
  <link rel="stylesheet" href="attendance-ui.css?v=20260725-attendance-result">
</head>
<body>
  <div class="language-switch" role="group" aria-label="اختيار اللغة">
    <button type="button" data-language="ar">العربية</button>
    <button type="button" data-language="en">English</button>
  </div>
  <div id="boot" class="boot"><i class="fa-solid fa-fingerprint"></i><span></span><p id="boot-text">نجهّز بوابة الموظف...</p></div>
  <main id="pin-page" class="pin-page hidden">
    <section class="pin-card">
      <div class="portal-mark"><i class="fa-solid fa-fingerprint"></i></div>
      <span id="portal-brand">ركائز للموظفين</span>
      <h1 id="login-title">دخول البصمة</h1>
      <p id="login-help">أدخل رقم هاتفك الشخصي للدخول مباشرة</p>
      <form id="phone-form">
        <div class="login-phone-row">
          <select id="employee-dial" aria-label="مفتاح الدولة"></select>
          <input id="employee-phone" inputmode="numeric" maxlength="15" placeholder="رقم الهاتف" autocomplete="tel" required>
        </div>
        <button id="phone-login-button">دخول</button>
      </form>
      <small id="pin-message"></small>
    </section>
  </main>
  <main id="employee-app" class="employee-app hidden"></main>
  <div id="portal-modal"></div>
  <div id="portal-toast" class="portal-toast hidden"></div>
  <div id="portal-loading" class="portal-loading hidden"><div><i class="fa-solid fa-fingerprint"></i><span></span><h3>يرجى الانتظار</h3><p>يتم حفظ بياناتك...</p></div></div>
  <script>
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js?v=20260805-attendance-alerts"));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script type="module" src="app.js?v=20261005-approval-notifications"></script>
</body>
</html>
